<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="robots"
      content="noindex, nofollow"
    />

    <meta
      name="theme-color"
      content="#071321"
    />

    <title>Redirecionando | Gesso Kauan</title>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background: #071321;
      }

      main {
        width: min(100%, 480px);
        text-align: center;
      }

      .loader {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #efc778;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 5vw, 2rem);
      }

      p {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 999px;
        color: #071321;
        background: #efc778;
        font-weight: 800;
        text-decoration: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader {
          animation: none;
        }
      }
    </style>

    <script>
      (function () {
        /*
         * GitHub Pages project:
         * https://gamin6031.github.io/GessoKauan/
         *
         * Em github.io usamos /GessoKauan/.
         * Em um domínio personalizado usamos /.
         */
        var PROJECT_BASE =
          location.hostname.endsWith(".github.io")
            ? "/GessoKauan/"
            : "/";

        var pathname = location.pathname;

        var route = pathname.startsWith(PROJECT_BASE)
          ? pathname.slice(PROJECT_BASE.length)
          : pathname.replace(/^\/+/, "");

        route = route
          .replace(/^404\.html\/?/, "")
          .replace(/^\/+|\/+$/g, "");

        var search = location.search || "";

        /*
         * O projeto usa HashRouter.
         *
         * /GessoKauan/servicos/x
         * vira:
         * /GessoKauan/#/servicos/x
         */
        var target =
          PROJECT_BASE +
          "#/" +
          route +
          search;

        if (!route) {
          target =
            PROJECT_BASE +
            "#/" +
            search;
        }

        location.replace(target);
      })();
    </script>
  </head>

  <body>
    <main>
      <div
        class="loader"
        aria-hidden="true"
      ></div>

      <h1>
        Abrindo a página…
      </h1>

      <p>
        Estamos redirecionando você para a rota correta da Gesso Kauan.
      </p>

      <a href="/GessoKauan/#/">
        Ir para o início
      </a>
    </main>
  </body>
</html>
